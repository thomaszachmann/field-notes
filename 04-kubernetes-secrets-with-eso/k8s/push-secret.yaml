# PushSecret: the other direction. A Secret that exists only in the cluster
# (created by an operator, a job, cert-manager, ...) is written INTO OpenBao,
# so that it is backed up with the Raft snapshots and visible in the audit log.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: generated-token
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - kind: SecretStore
      name: openbao
  selector:
    secret:
      name: generated-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: demo/generated-token
          property: token
