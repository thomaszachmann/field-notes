# A certificate for service-to-service use: the private key is generated by
# cert-manager inside the cluster, only the CSR travels to OpenBao.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: miniflux-internal
  namespace: demo
spec:
  secretName: miniflux-internal-tls
  duration: 720h        # 30 days - the role's default ttl
  renewBefore: 240h     # renew when a third of the lifetime is left
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - miniflux.demo.svc
    - miniflux.demo.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: openbao-cluster-internal
